name: PR 39 preview release gates

on:
  push:
    branches:
      - claude/code-to-github-zn0nab

permissions:
  contents: read

jobs:
  preview-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BASE_URL: https://motoros-git-claude-code-to-github-zn0nab-clip-website.vercel.app
    steps:
      - name: Check out branch
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Exercise deployed finance handoff and platform denial
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { chromium } from '@playwright/test';

          const baseUrl = process.env.BASE_URL;
          const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
          const assert = (condition, message) => {
            if (!condition) throw new Error(message);
          };

          async function runGate() {
            const browser = await chromium.launch({ headless: true });
            try {
              const page = await browser.newPage();
              const financeResponse = await page.goto(`${baseUrl}/finance`, {
                waitUntil: 'networkidle',
                timeout: 30_000,
              });
              assert(financeResponse, 'Finance route returned no response');
              assert(financeResponse.status() < 400, `Finance route returned ${financeResponse.status()}`);

              await page.getByLabel('Deposit amount in pounds').fill('3000');
              await page.getByRole('button', { name: 'PCP', exact: true }).click();
              await page.getByRole('button', { name: '60m', exact: true }).click();

              const apr = page.getByLabel('Representative APR percentage');
              await apr.evaluate((element) => {
                element.value = '8.5';
                element.dispatchEvent(new Event('input', { bubbles: true }));
                element.dispatchEvent(new Event('change', { bubbles: true }));
              });

              await page.getByRole('link', { name: 'Get a personalised quote' }).click();
              await page.waitForURL(/\/finance\?.+/, { timeout: 15_000 });
              await page.waitForLoadState('networkidle');

              const url = new URL(page.url());
              assert(url.searchParams.get('deposit') === '3000', `Deposit handoff mismatch: ${url.searchParams.get('deposit')}`);
              assert(url.searchParams.get('term') === '60', `Term handoff mismatch: ${url.searchParams.get('term')}`);
              assert(url.searchParams.get('type') === 'pcp', `Product handoff mismatch: ${url.searchParams.get('type')}`);
              assert(url.searchParams.get('apr') === '8.5', `APR handoff mismatch: ${url.searchParams.get('apr')}`);
              assert(/^\d+$/.test(url.searchParams.get('monthly') ?? ''), 'Monthly payment was not carried');

              await page.locator('#finDeposit').waitFor({ state: 'visible' });
              assert((await page.locator('#finDeposit').inputValue()) === '£3000', 'Enquiry deposit did not resynchronise');
              assert((await page.locator('#finTerm').inputValue()) === '60', 'Enquiry term did not resynchronise');
              const message = await page.locator('#finMessage').inputValue();
              assert(message.includes('PCP illustration at 8.5% APR'), `Enquiry message missing APR/product: ${message}`);
              await page.getByText('Illustrative APR ·').waitFor({ state: 'visible' });
              assert((await page.locator('body').innerText()).includes('8.5%'), 'Calculator summary missing APR');

              const platformPage = await browser.newPage();
              const platformResponse = await platformPage.goto(`${baseUrl}/platform`, {
                waitUntil: 'domcontentloaded',
                timeout: 30_000,
              });
              assert(platformResponse, 'Platform route returned no response');
              const platformStatus = platformResponse.status();
              const platformText = await platformPage.locator('body').innerText();
              assert(
                platformStatus === 404 || !platformText.includes('All dealerships'),
                `Unauthenticated /platform was exposed (status ${platformStatus})`,
              );

              console.log('Finance handoff verified in deployed preview:', page.url());
              console.log('Unauthenticated platform denial verified with status:', platformStatus);
            } finally {
              await browser.close();
            }
          }

          let lastError;
          for (let attempt = 1; attempt <= 12; attempt += 1) {
            try {
              await runGate();
              process.exit(0);
            } catch (error) {
              lastError = error;
              console.error(`Preview gate attempt ${attempt} failed:`, error instanceof Error ? error.message : error);
              if (attempt < 12) await sleep(10_000);
            }
          }
          throw lastError;
          NODE
